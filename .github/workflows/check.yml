name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建各课程并查坏链
        run: |
          for b in */build.py; do python3 "$b" --check; done
      - name: 禁词闸
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: python3 tools/gate.py
